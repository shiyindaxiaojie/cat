moduleName: ""
nameOverride: ""
clusterDomain: cluster.local
imagePullSecrets: []

serviceAccount:
  create: false
  annotations: {}
  name: ""

cat:
  mysql:
    enabled: true
    rootpasswd: rootpasswd
    database: cat
    port: 3306
    image:
      repository: mysql
      tag: "5.7.37"
      pullPolicy: IfNotPresent
    storageClassName: ""
    pvc:
      storage: 5Gi
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
    podAnnotations: {}
    podSecurityContext: {}
    securityContext: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    terminationGracePeriodSeconds: 30
    livenessProbe:
      initialDelaySeconds: 60
      periodSeconds: 10
      timeoutSeconds: 3
      successThreshold: 1
      failureThreshold: 6
    readinessProbe:
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 3
      successThreshold: 1
      failureThreshold: 12

  server:
    replicas: 1
    # Empty means the chart-generated Headless Service DNS name is used.
    serverUrl: ""
    image:
      repository: shiyindaxiaojie/cat
      tag: v3.4.2
      pullPolicy: IfNotPresent
    mysql:
      # Set host/password here when cat.mysql.enabled is false.
      host: ""
      port: 3306
      user: root
      password: ""
      # Empty inherits cat.mysql.database.
      schema: ""
    jvm:
      # Keep xms and xmx equal to avoid heap resizing under load.
      xms: 1g
      xmx: 1g
      xss: 256k
      gcMode: G1
      maxGcPauseMillis: 200
      useGcLog: "Y"
      useHeapDump: "Y"
      useAlwaysPretouch: "N"
      useStringDeduplication: "N"
      printJvmFlags: "N"
    svc:
      type: ClusterIP
      httpPort: 8080
      tcpPort: 2280
    storageClassName: ""
    pvc:
      storage: 15Gi
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 2Gi
    podAnnotations: {}
    podSecurityContext: {}
    securityContext: {}
    nodeSelector: {}
    tolerations: []
    podAntiAffinity: true
    affinity: {}
    terminationGracePeriodSeconds: 30
    livenessProbe:
      initialDelaySeconds: 180
      periodSeconds: 10
      timeoutSeconds: 3
      successThreshold: 1
      failureThreshold: 6
    readinessProbe:
      initialDelaySeconds: 30
      periodSeconds: 5
      timeoutSeconds: 3
      successThreshold: 1
      failureThreshold: 24
