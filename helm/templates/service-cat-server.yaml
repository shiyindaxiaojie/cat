apiVersion: v1
kind: Service
metadata:
  name: {{ include "cat.server.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cat.module.labels" . | nindent 4 }}
spec:
  type: {{ .Values.cat.server.svc.type }}
  ports:
    - name: http
      port: {{ .Values.cat.server.svc.httpPort }}
      targetPort: http
      protocol: TCP
    - name: tcp
      port: {{ .Values.cat.server.svc.tcpPort }}
      targetPort: tcp
      protocol: TCP
  selector:
    {{- include "cat.server.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cat.server.headlessName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cat.module.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: http
      port: {{ .Values.cat.server.svc.httpPort }}
      targetPort: http
      protocol: TCP
    - name: tcp
      port: {{ .Values.cat.server.svc.tcpPort }}
      targetPort: tcp
      protocol: TCP
  selector:
    {{- include "cat.server.selectorLabels" . | nindent 4 }}
