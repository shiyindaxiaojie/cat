services:
  cat:
    image: cat:3.4.2-local
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      MYSQL_URL: mysql
      MYSQL_PORT: "3306"
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: "${MYSQL_ROOT_PASSWORD:-}"
      MYSQL_SCHEMA: cat
      # Docker DNS remains stable even if the CAT container IP changes.
      SERVER_URL: cat
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "2280:2280"
    restart: unless-stopped
    networks:
      - cat

  mysql:
    image: mysql:5.7.37
    environment:
      MYSQL_DATABASE: cat
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-}"
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../docs/scripts/cat-init-3.4.0.sql:/docker-entrypoint-initdb.d/cat-init.sql:ro
    restart: unless-stopped
    networks:
      - cat

networks:
  cat:
    driver: bridge

volumes:
  mysql-data:
