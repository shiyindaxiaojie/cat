name: Release Build

on:
  push:
    tags:
      - 'v*'
  release:
    types:
      - published

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: temurin
          cache: maven

      - name: Build with Maven
        run: |
          chmod +x mvnw
          ./mvnw -ntp package -DskipTests -U -T 4C -s "$GITHUB_WORKSPACE/settings.xml"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Select Docker version
        id: docker-version
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            echo "version=latest" >> "$GITHUB_OUTPUT"
          else
            echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        env:
          DOCKER_IMAGE: shiyindaxiaojie/cat-home
          DOCKER_VERSION: ${{ steps.docker-version.outputs.version }}
        run: |
          docker build -f docker/Dockerfile -t "$DOCKER_IMAGE:$DOCKER_VERSION" .
          docker push "$DOCKER_IMAGE:$DOCKER_VERSION"
